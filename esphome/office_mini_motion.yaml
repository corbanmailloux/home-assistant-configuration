esphome:
  name: office-mini-motion
  friendly_name: Office Mini Motion

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true
      flash_chip: generic

packages:
  device_base: !include common/device_base.yaml

logger:
  level: INFO

# Act as a Bluetooth Proxy
esp32_ble_tracker:
  scan_parameters:
    active: true
bluetooth_proxy:
  active: true

# Connect to the mmWave sensor:
uart:
  tx_pin: 17
  rx_pin: 21
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:

number:
  - platform: ld2410
    timeout:
      name: Timeout
    max_move_distance_gate:
      name: Max Move Distance Gate
    max_still_distance_gate:
      name: Max Still Distance Gate
    # Per-gate sensitivity. Raise thresholds until the idle energy of an empty
    # room sits comfortably below them. Still thresholds matter most for
    # stationary false positives; the module defaults are 0 for gates 0 and 1.
    g0:
      move_threshold:
        name: G0 Move Threshold
      still_threshold:
        name: G0 Still Threshold
    g1:
      move_threshold:
        name: G1 Move Threshold
      still_threshold:
        name: G1 Still Threshold
    g2:
      move_threshold:
        name: G2 Move Threshold
      still_threshold:
        name: G2 Still Threshold
    g3:
      move_threshold:
        name: G3 Move Threshold
      still_threshold:
        name: G3 Still Threshold
    g4:
      move_threshold:
        name: G4 Move Threshold
      still_threshold:
        name: G4 Still Threshold

switch:
  - platform: ld2410
    engineering_mode:
      name: "LD2410 Engineering Mode"
    bluetooth:
      name: "LD2410 Bluetooth"

binary_sensor:
  - platform: gpio
    pin:
      number: 16
      mode:
        input: true
        pulldown: true
    name: GPIO Presence
    device_class: presence
    on_press:
      then:
        - light.turn_on:
            id: onboard_led
            brightness: 80%
    on_release:
      then:
        - light.turn_off: onboard_led
  - platform: ld2410
    has_target:
      name: Presence
    # Diagnostics: tells you whether a false trigger came from moving or
    # still energy, which decides whether to raise a move_ or still_threshold.
    has_moving_target:
      name: Moving Target
      entity_category: diagnostic
    has_still_target:
      name: Still Target
      entity_category: diagnostic
    calibration:
      name: Calibration Running

sensor:
  - platform: ld2410
    detection_distance:
      name: Detection Distance
    # Per-gate energy, for calibration in engineering mode.
    g0:
      move_energy:
        name: G0 Move Energy
      still_energy:
        name: G0 Still Energy
    g1:
      move_energy:
        name: G1 Move Energy
      still_energy:
        name: G1 Still Energy
    g2:
      move_energy:
        name: G2 Move Energy
      still_energy:
        name: G2 Still Energy
    g3:
      move_energy:
        name: G3 Move Energy
      still_energy:
        name: G3 Still Energy
    g4:
      move_energy:
        name: G4 Move Energy
      still_energy:
        name: G4 Still Energy

text_sensor:
  - platform: ld2410
    version:
      name: Firmware Version
    calibration_result:
      name: Calibration Result

button:
  - platform: ld2410
    # Module-side auto-calibration (firmware V2.44+): measures the noise floor
    # for 10s with the room empty and rewrites all gate thresholds.
    background_correction:
      name: Calibrate Radar

light:
  - platform: monochromatic
    id: onboard_led
    name: Onboard LED
    default_transition_length: 0.25s
    # internal: true
    output: onboard_led_output

output:
  - id: onboard_led_output
    platform: ledc
    pin: 2
