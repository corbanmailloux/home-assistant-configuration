esphome:
  name: master-bath-presence
  friendly_name: Master Bath Presence

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true

packages:
  device_base: !include common/device_base.yaml

logger:
  level: INFO

# Act as a Bluetooth Proxy
# esp32_ble_tracker:
#   scan_parameters:
#     active: true
# bluetooth_proxy:
#   active: true

# Connect to the mmWave sensor:
uart:
  tx_pin: 17
  rx_pin: 21
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

