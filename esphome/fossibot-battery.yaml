esphome:
  name: fossibot-battery
  friendly_name: FossiBot Battery
  on_boot:
    # The light can only restore on/off, not the right colour, so let the script
    # pick the LED state from the real states once everything is set up.
    - priority: -100
      then:
        - script.execute: update_led

# https://github.com/Ylianst/ESP-FBot/blob/main/docs/example-m5atom-full.yaml

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      flash_chip: gd

packages:
  device_base: !include common/device_base.yaml

# Enable logging
logger:
  level: INFO

# Load external component from GitHub
external_components:
  - source: github://ylianst/esp-fbot

# BLE Client configuration
ble_client:
  - mac_address: "7C:2C:67:AB:F6:52"
    id: fbot_ble
    on_disconnect:
      - logger.log:
          level: WARN
          format: "FossiBot BLE link lost"
      # update_led shows a pulsing red LED while `connected` is off.
      - script.execute: update_led

# Configure the FBot component
fbot:
  id: my_fbot
  polling_interval: 5s  # How often to poll for updates (default: 2s)

# Binary sensors for connection and output states
binary_sensor:
  - platform: fbot
    fbot_id: my_fbot
    connected:
      name: "Connected"
      id: connected
      on_state:
        then:
          - script.execute: update_led
    usb_active:
      name: "USB Active"
    dc_active:
      name: "DC Active"
    ac_active:
      name: "AC Inverter Active"
      id: ac_active
      on_state:
        then:
          - script.execute: update_led
    light_active:
      name: "Light Active"

# Sensors for battery and power readings
sensor:
  - platform: fbot
    fbot_id: my_fbot
    battery_level:
      name: "Battery"
      id: battery_percent
      on_value:
        then:
          - script.execute: update_led
    input_power:
      name: "Input Power"
      id: input_watts
    output_power:
      name: "Output Power"
      id: output_watts
    system_power:
      name: "System Power"
      id: system_watts
    total_power:
      name: "Total Power"
      id: total_watts
    remaining_time:
      name: "Remaining Minutes"
      id: remaining_minutes
  # Convert remaining time from minutes to hours
  - platform: template
    name: "Remaining Hours"
    lambda: |-
      if (id(remaining_minutes).has_state()) {
        return id(remaining_minutes).state / 60.0;
      }
      return 0.0;
    unit_of_measurement: "h"
    accuracy_decimals: 1
    device_class: duration
    state_class: measurement
    update_interval: 5s
  # Net power (positive = charging, negative = discharging)
  - platform: template
    name: "Net Power"
    lambda: |-
      if (id(input_watts).has_state() && id(output_watts).has_state()) {
        return id(input_watts).state - id(output_watts).state;
      }
      return 0.0;
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    update_interval: 5s

# Switches to control outputs
switch:
  - platform: fbot
    fbot_id: my_fbot
    usb:
      name: "USB Output"
      id: usb_switch
    dc:
      name: "DC Output"
      id: dc_switch
    ac:
      name: "AC Inverter"
      id: ac_switch
    light:
      name: "Light"
      id: light_switch

# Status LED: link health first, then inverter state, then battery level.
# The level table is {battery threshold, red, green}; blue stays 0.
script:
  - id: update_led
    then:
      - lambda: |-
          static const float LEVELS[3][3] = {
              {50.0f, 0.0f, 1.0f},  // > 50%: green
              {15.0f, 1.0f, 1.0f},  // 16-50%: yellow
              {-1.0f, 1.0f, 0.0f},  // <= 15%: red
          };

          // No BLE link: pulsing red, so a dropped connection is visible locally.
          if (!id(connected).state) {
            id(status_led).turn_on()
                .set_rgb(1.0f, 0.0f, 0.0f)
                .set_brightness(0.5f)
                .set_effect("Pulse")
                .perform();
            return;
          }

          // Connected but the AC inverter is off: LED dark.
          if (!id(ac_active).state) {
            id(status_led).turn_off().perform();
            return;
          }

          const float level =
              id(battery_percent).has_state() ? id(battery_percent).state : 100.0f;
          const float *row = LEVELS[2];
          for (int i = 0; i < 3; i++) {
            if (level > LEVELS[i][0]) {
              row = LEVELS[i];
              break;
            }
          }

          // Default to 50% brightness on the LED.
          id(status_led).turn_on()
              .set_rgb(row[1], row[2], 0.0f)
              .set_brightness(0.5f)
              .set_effect("None")  // stop the disconnected pulse
              .perform();

# RGB LED on M5 ATOM (Pin 27, WS2812B)
light:
  - platform: esp32_rmt_led_strip
    internal: true
    chipset: WS2812
    pin: 27
    num_leds: 1
    channel_colors: GRB
    id: status_led
    name: "M5Atom Status LED"
    default_transition_length: 0.5s
    # Start dark; on_boot -> update_led sets the real state.
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 1s
          update_interval: 1s
