esphome:
  name: fossibot-battery
  friendly_name: FossiBot Battery

# https://github.com/Ylianst/ESP-FBot/blob/main/docs/example-m5atom-full.yaml

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      flash_chip: gd

packages:
  device_base: !include common/device_base.yaml

# Enable logging
logger:
  level: INFO

# Load external component from GitHub
external_components:
  - source: github://ylianst/esp-fbot

# BLE Client configuration
ble_client:
  - mac_address: "7C:2C:67:AB:F6:52"

# Configure the FBot component
fbot:
  id: my_fbot
  polling_interval: 5s  # How often to poll for updates (default: 2s)

# Binary sensors for connection and output states
binary_sensor:
  - platform: fbot
    fbot_id: my_fbot
    connected:
      name: "Connected"
      id: connected
      on_state:
        then:
          - script.execute: update_led
    usb_active:
      name: "USB Active"
    dc_active:
      name: "DC Active"
    ac_active:
      name: "AC Inverter Active"
      id: ac_active
      on_state:
        then:
          - script.execute: update_led
    light_active:
      name: "Light Active"

# Sensors for battery and power readings
sensor:
  - platform: fbot
    fbot_id: my_fbot
    battery_level:
      name: "Battery"
      id: battery_percent
      on_value:
        then:
          - script.execute: update_led
    input_power:
      name: "Input Power"
      id: input_watts
    output_power:
      name: "Output Power"
      id: output_watts
    system_power:
      name: "System Power"
      id: system_watts
    total_power:
      name: "Total Power"
      id: total_watts
    remaining_time:
      name: "Remaining Minutes"
      id: remaining_minutes
  # Convert remaining time from minutes to hours
  - platform: template
    name: "Remaining Hours"
    lambda: |-
      if (id(remaining_minutes).has_state()) {
        return id(remaining_minutes).state / 60.0;
      }
      return 0.0;
    unit_of_measurement: "h"
    accuracy_decimals: 1
    device_class: duration
    state_class: measurement
    update_interval: 5s
  # Net power (positive = charging, negative = discharging)
  - platform: template
    name: "Net Power"
    lambda: |-
      if (id(input_watts).has_state() && id(output_watts).has_state()) {
        return id(input_watts).state - id(output_watts).state;
      }
      return 0.0;
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    update_interval: 5s

# Switches to control outputs
switch:
  - platform: fbot
    fbot_id: my_fbot
    usb:
      name: "USB Output"
      id: usb_switch
    dc:
      name: "DC Output"
      id: dc_switch
    ac:
      name: "AC Inverter"
      id: ac_switch
    light:
      name: "Light"
      id: light_switch

# Script to update LED based on connection, AC state, and battery level
script:
  - id: update_led
    then:
      - if:
          condition:
            binary_sensor.is_off: connected
          then:
            # Battery not connected - show white
            - light.turn_on:
                id: status_led
                red: 100%
                green: 100%
                blue: 100%
                brightness: 50%
          else:
            # Battery is connected
            - if:
                condition:
                  binary_sensor.is_off: ac_active
                then:
                  # AC not active - turn off LED
                  - light.turn_off: status_led
                else:
                  # AC is active - show battery level
                  - if:
                      condition:
                        lambda: 'return id(battery_percent).state > 30;'
                      then:
                        # Green for > 30%
                        - light.turn_on:
                            id: status_led
                            red: 0%
                            green: 100%
                            blue: 0%
                            brightness: 50%
                  - if:
                      condition:
                        lambda: 'return id(battery_percent).state > 15 && id(battery_percent).state <= 30;'
                      then:
                        # Yellow for 15-30%
                        - light.turn_on:
                            id: status_led
                            red: 100%
                            green: 100%
                            blue: 0%
                            brightness: 50%
                  - if:
                      condition:
                        lambda: 'return id(battery_percent).state <= 15;'
                      then:
                        # Red for <= 15%
                        - light.turn_on:
                            id: status_led
                            red: 100%
                            green: 0%
                            blue: 0%
                            brightness: 50%

# RGB LED on M5 ATOM (Pin 27, WS2812B)
light:
  - platform: esp32_rmt_led_strip
    internal: true
    chipset: WS2812
    pin: 27
    num_leds: 1
    channel_colors: GRB
    id: status_led
    name: "M5Atom Status LED"
    default_transition_length: 0.5s
    restore_mode: ALWAYS_ON
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 1s
          update_interval: 1s
