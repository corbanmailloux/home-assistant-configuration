esphome:
  name: fairy-lights
  friendly_name: "Fairy Lights"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    advanced:
      flash_chip: gd
      sram1_as_iram: true

packages:
  device_base: !include common/device_base.yaml

# Enable logging
logger:
  level: INFO

# BLE Hub
esp32_ble_tracker:
  scan_parameters:
    # interval: 1100ms
    # window: 1100ms
    active: true

bluetooth_proxy:
  active: true

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

output:
  - platform: ledc
    pin: 2
    frequency: 5000
    id: pin_2

light:
  - platform: monochromatic
    name: "Fairy Lights"
    icon: "mdi:bed"
    output: pin_2
    # Come back off after a power blip instead of restoring "on".
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - pulse:
      - flicker:
