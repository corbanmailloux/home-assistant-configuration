substitutions:
  device_name: "garage-parking-sign"
  friendly_name: Garage Parking Sign

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      flash_chip: generic
      sram1_as_iram: true

packages:
  device_base: !include common/device_base.yaml

wifi:
  use_address: 192.168.1.73

# Enable logging
logger:
  level: INFO

# ---------------------------------------------------------------------------
# Range sensors
# ---------------------------------------------------------------------------
# The HA automation in packages/garage_parking_sign.yaml turns one polling
# switch on when its door starts opening, and off again when it closes.
switch:
  - platform: template
    name: "Poll Range Sensor - Left"
    optimistic: true
    icon: mdi:update
    id: poll_range_sensor_left
  - platform: template
    name: "Poll Range Sensor - Right"
    optimistic: true
    icon: mdi:update
    id: poll_range_sensor_right

interval:
  - interval: 100ms
    then:
      - if:
          condition:
            switch.is_on: poll_range_sensor_left
          then:
            - component.update: ultrasonic_sensor_left
      - if:
          condition:
            switch.is_on: poll_range_sensor_right
          then:
            - component.update: ultrasonic_sensor_right

sensor:
  - platform: wifi_signal
    name: "${friendly_name} - WiFi Signal"
    update_interval: 60s

  - platform: ultrasonic
    trigger_pin: 32
    echo_pin: 12
    update_interval: never # Triggered by the interval above.
    id: ultrasonic_sensor_left
    name: "Range Sensor - Left"
    unit_of_measurement: "inches"
    filters:
      - multiply: 39.37 # Convert from meters to inches
      - sliding_window_moving_average:
          window_size: 3
          send_every: 2
      - timeout: 1000ms # When polling stops, reset to NaN so the sign clears.
    on_value:
      then:
        - script.execute:
            id: update_sign
            distance: !lambda return x;
            target: !lambda return id(target_distance_left).state;

  - platform: ultrasonic
    trigger_pin: 27
    echo_pin: 25
    update_interval: never # Triggered by the interval above.
    id: ultrasonic_sensor_right
    name: "Range Sensor - Right"
    unit_of_measurement: "inches"
    filters:
      - multiply: 39.37 # Convert from meters to inches
      - sliding_window_moving_average:
          window_size: 3
          send_every: 2
      - timeout: 1000ms # When polling stops, reset to NaN so the sign clears.
    on_value:
      then:
        - script.execute:
            id: update_sign
            distance: !lambda return x;
            target: !lambda return id(target_distance_right).state;

# ---------------------------------------------------------------------------
# Crossing-sign lamps
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: 18
    id: gpio_hand
  - platform: ledc
    pin: 19
    id: gpio_walk

light:
  - platform: monochromatic
    output: gpio_hand
    default_transition_length: 0s
    icon: mdi:hand-back-left
    id: light_hand
    name: "Hand"
  - platform: monochromatic
    output: gpio_walk
    default_transition_length: 0s
    icon: mdi:walk
    id: light_walk
    name: "Walk"

  # One 87-LED strip snakes around the unit, covering both number displays.
  # The digits are drawn straight into this strip's LED buffer by the
  # `Display Number` lambda below, using the segment ranges in its table.
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: 22
    num_leds: 87
    chipset: WS2812
    id: digit_display_light
    name: "Digit Full Light"
    internal: true
    default_transition_length: 0s

# ---------------------------------------------------------------------------
# Controls
# ---------------------------------------------------------------------------
number:
  - platform: template
    name: Target Distance - Left
    id: target_distance_left
    optimistic: true
    mode: box
    entity_category: config
    min_value: 0
    max_value: 99
    step: 1
    restore_value: true
    unit_of_measurement: "inches"
    icon: "mdi:map-marker-distance"

  - platform: template
    name: Target Distance - Right
    id: target_distance_right
    optimistic: true
    mode: box
    entity_category: config
    min_value: 0
    max_value: 99
    step: 1
    restore_value: true
    unit_of_measurement: "inches"
    icon: "mdi:map-marker-distance"

  - platform: template
    name: Digit Brightness
    id: digit_brightness
    optimistic: true
    mode: slider
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    unit_of_measurement: "%"
    icon: "mdi:brightness-percent"

  - platform: template
    name: Digit Red
    id: digit_red
    optimistic: true
    mode: slider
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    unit_of_measurement: "%"
    icon: "mdi:palette"

  - platform: template
    name: Digit Green
    id: digit_green
    optimistic: true
    mode: slider
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    unit_of_measurement: "%"
    icon: "mdi:palette"

  - platform: template
    name: Digit Blue
    id: digit_blue
    optimistic: true
    mode: slider
    entity_category: config
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    unit_of_measurement: "%"
    icon: "mdi:palette"

  # What the sign is currently showing, and how HA clears it.
  # -10 = blank both digits, -11 = a dash on each, -9..-1 = minus + digit,
  # 0-9 = blank + digit, 10-99 = two digits.
  - platform: template
    name: Display Number
    id: display_number
    optimistic: true
    mode: box
    min_value: -11
    max_value: 99
    initial_value: -10 # Start blank.
    step: 1
    on_value:
      then:
        - lambda: |-
            // `Display Number` publishes its initial value during component setup,
            // before the LED output has been linked to its LightState. Touching the
            // strip then (schedule_show() in particular) dereferences a null parent
            // and crashes the boot. Nothing is lit at that point anyway (initial
            // value is -10), so skip drawing until setup is finished.
            if (!App.is_setup_complete())
              return;

            // Segment numbering used by both tables below:
            //
            //        ┌──1──┐
            //        │     │
            //        6     2
            //        │     │
            //        ├──7──┤
            //        │     │
            //        5     3
            //        │     │
            //        └──4──┘
            //
            // ---- GLYPH: which segments each digit lights ----------------------
            // One bit per segment, bit 0 = segment 1 ... bit 6 = segment 7, so a
            // digit's byte is sum(1 << (segment - 1)) over the segments it lights.
            // These were lifted from the original per-digit `on_value_range` blocks
            // (each digit listed its own turn_on/turn_off segments per value) and
            // then packed; the mapping was re-checked against those blocks for every
            // value the sign can show.
            //
            //   digit   lit segments    binary    byte
            //     0     1 2 3 4 5 6     0111111   0x3F
            //     1     2 3             0000110   0x06
            //     2     1 2 4 5 7       1011011   0x5B
            //     3     1 2 3 4 7       1001111   0x4F
            //     4     2 3 6 7         1100110   0x66
            //     5     1 3 4 6 7       1101101   0x6D
            //     6     1 3 4 5 6 7     1111101   0x7D
            //     7     1 2 3           0000111   0x07
            //     8     1 2 3 4 5 6 7   1111111   0x7F
            //     9     1 2 3 4 6 7     1101111   0x6F
            //
            // Non-digits are not in this table: blank = 0x00, minus = 0x40 (segment
            // 7 only). See the `mask` line further down for those two.
            static const uint8_t GLYPH[10] = {0x3F, 0x06, 0x5B, 0x4F, 0x66, 0x6D, 0x7D, 0x07, 0x7F, 0x6F};

            // ---- SEG: which LEDs physically belong to each segment -------------
            // The strip snakes around the unit, so LED indices are not ordered
            // left-to-right and a digit's segments are not adjacent in the buffer:
            //   digit 1 (left / tens or minus) lives in LED spans 1-18 and 62-83
            //   digit 2 (right / ones)         lives in LED spans 22-59 and 84-86
            // Each pair is {first, last}, both inclusive, copied from the fourteen
            // `partition` lights that used to define the segments (their from/to).
            // The drawing loop adds 1 to `last` because addressable light ranges are
            // end-exclusive.
            //
            //   seg1  seg2  seg3  seg4  seg5  seg6  seg7
            // d1 77-79 69-73 62-67 16-18 8-13  1-6   81-83
            // d2 42-44 34-39 28-32 22-24 54-59 47-52 84-86
            //
            // The other 23 LEDs (0, 7, 14-15, 19-21, 25-27, 33, 40-41, 45-46, 53,
            // 60-61, 68, 74-76, 80) fall in the gaps between those segment runs,
            // so they always stay dark.
            static const uint8_t SEG[2][7][2] = {
                {{77, 79}, {69, 73}, {62, 67}, {16, 18}, {8, 13}, {1, 6}, {81, 83}},
                {{42, 44}, {34, 39}, {28, 32}, {22, 24}, {54, 59}, {47, 52}, {84, 86}},
            };

            const int value = (int) x;

            // Decode the number into two glyphs: 0-9 = digit, -1 = blank, -2 = minus.
            int glyph[2];
            if (value == -10) {
              glyph[0] = glyph[1] = -1;
            } else if (value == -11) {
              glyph[0] = glyph[1] = -2;
            } else if (value < 0) {
              glyph[0] = -2;
              glyph[1] = -value;
            } else if (value < 10) {
              glyph[0] = -1;
              glyph[1] = value;
            } else {
              glyph[0] = value / 10;
              glyph[1] = value % 10;
            }

            const float scale = id(digit_brightness).state / 100.0f;
            auto channel = [scale](float percent) -> uint8_t {
              return (uint8_t) roundf(percent * 2.55f * scale);
            };
            Color color(channel(id(digit_red).state), channel(id(digit_green).state),
                        channel(id(digit_blue).state));
            // Semantic accents. Delete these two branches to always use the sliders' color.
            if (value == 0) {
              color = Color(0, channel(100.0f), 0); // on target
            } else if (value < 0 && value > -10) {
              color = Color(channel(100.0f), 0, 0); // past target / too close
            }

            auto *strip = (esphome::light::AddressableLight *) id(digit_display_light).get_output();
            strip->all() = Color(0, 0, 0);
            for (int d = 0; d < 2; d++) {
              // Turn the glyph code into a segment mask: -2 (minus) lights only the
              // middle segment (bit 6 = 0x40), -1 (blank) lights nothing, 0-9 index
              // the GLYPH table above.
              const uint8_t mask = glyph[d] == -2 ? 0x40 : glyph[d] == -1 ? 0x00 : GLYPH[glyph[d]];
              for (int s = 0; s < 7; s++) {
                if ((mask & (1 << s)) != 0)
                  strip->range(SEG[d][s][0], SEG[d][s][1] + 1).set(color);
              }
            }
            strip->schedule_show();

# ---------------------------------------------------------------------------
# Show the measurement
# ---------------------------------------------------------------------------
script:
  - id: update_sign
    parameters:
      distance: float
      target: float
    then:
      - lambda: |-
          const bool valid = !isnan(distance);
          int display_value;
          if (!valid) {
            display_value = -10; // blank
          } else {
            const int delta = (int) roundf(distance - target);
            // Over 20 is noisy; show two dashes instead of a number.
            display_value = delta >= 20 ? -11 : max(-9, min(delta, 99));
          }

          // Publish only when the shown value changes. The sign still updates as
          // fast as the digit changes, without a 5 Hz stream of HA state changes.
          if ((int) id(display_number).state != display_value) {
            id(display_number).publish_state(display_value);
          }

          // Hand when you are there, walk when you still have room. Only touch
          // the lamps when the wanted state differs from the current one.
          const bool hand = valid && (distance - target) < 3.0f;
          const bool walk = valid && !hand;
          if (id(light_hand).current_values.is_on() != hand) {
            if (hand) {
              id(light_hand).turn_on().perform();
            } else {
              id(light_hand).turn_off().perform();
            }
          }
          if (id(light_walk).current_values.is_on() != walk) {
            if (walk) {
              id(light_walk).turn_on().perform();
            } else {
              id(light_walk).turn_off().perform();
            }
          }
