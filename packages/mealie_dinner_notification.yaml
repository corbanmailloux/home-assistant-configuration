# Mealie Dinner Notification
# Load tonight's dinner plan, extract the total time, and set a notification to start cooking at the right time to have dinner ready by 6:15 PM.

input_datetime:
  dinner_target_time:
    name: Dinner Target Time
    has_date: false
    has_time: true

  dinner_start_time:
    name: Dinner Start Time
    has_date: true
    has_time: true

input_number:
  dinner_total_minutes:
    name: Dinner Total Time (min)
    min: 0
    max: 600
    step: 1

input_text:
  dinner_recipe_name:
    name: Dinner Recipe Name

automation:
  - id: mealie_fetch_todays_dinner
    alias: "Mealie - Fetch today's dinner"
    mode: single
    triggers:
      - trigger: time
        at: "00:08:00"
      - trigger: time
        at: "00:16:00"
      - trigger: state
        entity_id: input_datetime.dinner_target_time

    actions:
      - action: mealie.get_mealplan
        response_variable: mealplan_response
        data:
          config_entry_id: 01KJXY75D445VF2H2HHWTA74XE

      - variables:
          recipe_name: >-
            {% set dinners = mealplan_response.mealplan
               | selectattr('entry_type','eq','dinner')
               | list %}
            {{ (dinners | first).recipe.name if dinners else '' }}

          total_minutes: >-
            {% set dinners = mealplan_response.mealplan
               | selectattr('entry_type','eq','dinner')
               | list %}
            {% if dinners %}
              {#- Mealie returns strings like "5 hours" or "33 minutes". -#}
              {% set total_time = (dinners | first).recipe.total_time | default('', true) %}
              {% set hours = total_time | regex_findall('(\d+)\s*hour') | map('int') | list %}
              {% set minutes = total_time | regex_findall('(\d+)\s*min') | map('int') | list %}
              {{ (hours | sum) * 60 + (minutes | sum) }}
            {% else %}
              0
            {% endif %}

          target_time: >-
            {{ today_at(states('input_datetime.dinner_target_time')) }}

          start_time: >-
            {{ today_at(states('input_datetime.dinner_target_time'))
               - timedelta(minutes=total_minutes | int) }}

      - action: input_text.set_value
        target:
          entity_id: input_text.dinner_recipe_name
        data:
          value: "{{ recipe_name }}"

      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.dinner_start_time
        data:
          datetime: "{{ start_time }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.dinner_total_minutes
        data:
          value: "{{ total_minutes | int }}"

  - id: mealie_dinner_start_notification
    alias: "Mealie - Start dinner notification"
    mode: single
    triggers:
      # Only fire in the 5 minutes after the computed start time. This avoids a
      # stale start time (e.g. a recipe longer than the time until dinner) firing
      # a notification at midnight.
      - trigger: template
        value_template: >-
          {% set start = as_datetime(states('input_datetime.dinner_start_time'), none) %}
          {% if start is not none %}
            {% set start = start | as_local %}
          {% endif %}
          {{ start is not none
             and start <= now() < start + timedelta(minutes=5) }}

    conditions:
      - condition: template
        value_template: >-
          {{ states('input_text.dinner_recipe_name') not in ['', 'unknown', 'unavailable'] }}

    actions:
      - action: notify.corban
        data:
          title: "Start Cooking Now"
          message: >-
            Start '{{ states('input_text.dinner_recipe_name') }}' ({{ states('input_number.dinner_total_minutes') | int }} min) now to have dinner ready by {{ today_at(states('input_datetime.dinner_target_time')).strftime('%-I:%M %p') }}.
          data:
            tag: "mealie_dinner_start"
