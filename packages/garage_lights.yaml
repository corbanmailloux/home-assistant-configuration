light:
  - platform: group
    name: Garage Non-Switched Lights
    unique_id: bbfd0ea2-b809-4e30-9bb5-20aa843cc741
    entities:
      # - light.garage_main_lights
      - light.ratgdo_left_garage_door_light
      - light.ratgdo_right_garage_door_light
      - light.garage_nook_light

template:
  - triggers:
      - trigger: state
        entity_id:
          - cover.ratgdo_left_garage_door_door
          - cover.ratgdo_right_garage_door_door
        from: "closed"
        to:
          - "opening"
          - "open"
      - trigger: state
        entity_id:
          - binary_sensor.garage_side_person_door_contact
          - binary_sensor.garage_back_person_door_contact
        from: "off"
        to: "on"
    binary_sensor:
      - name: "garage_door_just_opened"
        unique_id: 05c6b204-85da-4fd4-9175-e6862fea8002
        device_class: door
        auto_off:
          seconds: 10
        state: "on" # Covered by auto_off.

  - binary_sensor:
      - name: "Garage Assumed Motion"
        unique_id: 75e72911-0217-4df9-a900-f7808bb0081e
        device_class: occupancy
        state: >-
          {{
            is_state('binary_sensor.garage_door_just_opened', 'on') or
            is_state('binary_sensor.garage_right_motion', 'on') or
            is_state('binary_sensor.garage_opener_motion_sensor_occupancy', 'on')
          }}
        # OLD:
        # # Only count the door sensors as motion if the lights are off. This avoids retriggering when leaving the garage.
        # state: >-
        #   {{
        #     ( is_state('binary_sensor.garage_door_just_opened', 'on') and is_state('light.garage_main_lights', 'off')) or
        #     is_state('binary_sensor.garage_right_motion', 'on') or
        #     is_state('binary_sensor.garage_opener_motion_sensor_occupancy', 'on')
        #   }}

automation:
  - id: 01c0a256-d577-4934-b97f-208357c58cb8
    alias: Garage - All Lights Follow Switched Lights
    triggers:
      - trigger: state
        entity_id: light.garage_main_lights
        not_from:
          - "unknown"
          - "unavailable"
    actions:
      - alias: "On or Off?"
        choose:
          - conditions: >-
              {{ trigger.to_state.state == "on" }}
            sequence:
              - alias: "Turn on lights"
                action: light.turn_on
                target:
                  entity_id: light.garage_lights # Group
                data:
                  color_temp_kelvin: 5000
                  brightness_pct: 100
                  transition: 0
          - conditions: >-
              {{ trigger.to_state.state == "off" }}
            sequence:
              - alias: "Turn off lights"
                action: light.turn_off
                target:
                  entity_id: light.garage_lights # Group

  - id: 6bfc0d18-4b00-4728-ba56-5c6eccb3bee2
    alias: Garage - New Motion Lights
    mode: restart
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.garage_assumed_motion
        from: "off"
        to: "on"
    conditions:
      - alias: "Garage automations are not disabled"
        condition: state
        entity_id: input_boolean.room_exclude_garage
        state: "off"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.garage_main_lights
        data:
          color_temp_kelvin: 5000
          brightness_pct: 100
          transition: 0
      - wait_for_trigger:
          trigger: state
          entity_id: binary_sensor.garage_assumed_motion
          from: "on"
          to: "off"
      - delay:
          minutes: 10
      - action: light.turn_off
        target:
          entity_id: light.garage_main_lights
        data:
          transition: 0

  # This is disabled and may be removed in the future.
  - id: 6f80226a-15d7-4285-83c5-e643c16f1b7f
    alias: Garage - Motion Lights
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.garage_assumed_motion
        from: "off"
        to: "on"
        id: "on"
      - trigger: state
        entity_id: binary_sensor.garage_assumed_motion
        to: "off"
        for:
          minutes: 10
        id: "off"
    conditions:
      - alias: "Garage automations are not disabled"
        condition: state
        entity_id: input_boolean.room_exclude_garage
        state: "off"
    actions:
      - alias: "On or Off?"
        choose:
          - conditions: >-
              {{ trigger.id == "on" }}
            sequence:
              - alias: "Turn on lights"
                action: light.turn_on
                target:
                  entity_id: light.garage_main_lights
                data:
                  color_temp_kelvin: 5000
          - conditions: >-
              {{ trigger.id == "off" }}
            sequence:
              - alias: "Turn off lights"
                action: light.turn_off
                target:
                  entity_id: light.garage_main_lights

  - id: 170ab84a-5bab-4192-ba0e-21e72c395bb4
    alias: Garage - Keep the garage door opener lights on when the main lights are on
    triggers:
      - trigger: state
        entity_id:
          - light.ratgdo_left_garage_door_light
          - light.ratgdo_right_garage_door_light
        from: "on"
        to: "off"
    conditions:
      - alias: "Main lights on"
        condition: state
        entity_id: light.garage_main_lights
        state: "on"
    actions:
      - alias: "Turn the lights back on"
        action: light.turn_on
        target:
          entity_id: light.garage_lights
        data:
          color_temp_kelvin: 5000
          brightness_pct: 100
          transition: 0

  # Safety net for the motion sensor in the garage getting stuck "on" (or for the lights
  # being left on by hand): nudge Corban once the main lights have been on for an hour.
  # Note: a `for:` timer restarts on every HA restart or on a momentary `unavailable`,
  # so the nudge can arrive late — never early.
  - id: 11a896ab-85e5-4675-b000-aab91239da23
    alias: Garage - Notify when the main lights have been left on
    mode: single
    triggers:
      - trigger: state
        entity_id: light.garage_main_lights
        to: "on"
        for:
          hours: 1
    conditions:
      - alias: "Garage automations are not disabled"
        condition: state
        entity_id: input_boolean.room_exclude_garage
        state: "off"
    actions:
      - action: notify.corban
        data:
          title: "Garage lights left on"
          message: >-
            The garage main lights have been on for over an hour (since
            {{ states.light.garage_main_lights.last_changed | as_timestamp | timestamp_custom("%-I:%M %p") }}).
          data:
            tag: "garage_lights_left_on"
            actions:
              - action: "GARAGE_MAIN_LIGHTS_OFF"
                title: "Turn Off Lights"
                activationMode: "background"
                authenticationRequired: false
                destructive: true
                behavior: "default"

  - id: 7df92bbf-5902-4f47-8943-da32ce96261d
    alias: Garage - Turn off the main lights from the notification
    mode: single
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "GARAGE_MAIN_LIGHTS_OFF"
    actions:
      - alias: "Turn off the lights"
        action: light.turn_off
        target:
          entity_id: light.garage_main_lights
        data:
          transition: 0
      - alias: "Clear the notification"
        action: notify.corban
        data:
          message: clear_notification
          data:
            tag: "garage_lights_left_on"

  # Clear the notification if the lights get turned off another way (wall switch, motion
  # timeout), so a stale "left on" card doesn't linger with a useless button.
  - id: 1d4f6a0e-3f9c-4e0a-9c7d-2b0f4f0c9e51
    alias: Garage - Clear the left-on notification when the main lights turn off
    mode: single
    triggers:
      - trigger: state
        entity_id: light.garage_main_lights
        from: "on"
        to: "off"
    actions:
      - action: notify.corban
        data:
          message: clear_notification
          data:
            tag: "garage_lights_left_on"
