# There are two Switchbot Curtain 3 motors installed in the Master Bedroom.

# Movement speed comes from the native per-device option "Curtain movement
# speed" = 2 (Settings > Devices & services > SwitchBot > device > Configure).
# That reproduces the old v6-quietdrift `speed: 2` byte-for-byte.
#
# The actions below deliberately pass no `speed:` and therefore inherit that
# default. Passing `speed:` overrides the device option, and only `normal` (255)
# and `silent` (1) are accepted there - anything else is silently dropped.
# https://www.home-assistant.io/integrations/cover/

template:
  - binary_sensor:
      - name: "Bedroom Curtains - Low Battery"
        unique_id: 31ba5362-fa29-4a9f-8eff-f7c2a166f8f2
        device_class: battery
        state: >-
          {{
            states("sensor.master_bedroom_curtain_left_battery") | int(100) < 20 or
            states("sensor.master_bedroom_curtain_right_battery") | int(100) < 20
          }}

  - cover:
      # Group the left and right curtains together
      - unique_id: 473164d6-14b5-4357-9177-678e86f29e39
        name: Master Bedroom Curtains
        device_class: curtain
        set_cover_position:
          - action: cover.set_cover_position
            target:
              entity_id:
                - cover.master_bedroom_curtain_left
                - cover.master_bedroom_curtain_right
            data:
              position: "{{position}}"
        default_entity_id: cover.master_bedroom_curtains
        position: >-
          {% set left = state_attr("cover.master_bedroom_curtain_left", "current_position") %}
          {% set right = state_attr("cover.master_bedroom_curtain_right", "current_position") %}
          {% if left is number and right is number %}
            {% set position = (left + right) / 2 %}

            {% if position < 3 %}
              0
            {% else %}
              {{ position }}
            {% endif %}
          {% endif %}

automation:
  - alias: "Open curtains when Corban wakes up"
    id: 49524a70-ea40-4ed6-b07f-e6bd950baef0
    triggers:
      - trigger: event
        event_type: corban_iphone_sleep
        event_data:
          sleep: false
    conditions:
      - alias: "Weekdays"
        condition: time
        weekday:
          - "mon"
          - "tue"
          - "wed"
          - "thu"
          - "fri"
      - alias: "Corban is home"
        condition: state
        entity_id: person.corban
        state: "home"
      - not:
          - alias: "Maggie is not home, such as every other Friday"
            condition: state
            entity_id: person.maggie
            state: "home"
      - alias: "Master Bedroom automations are not disabled"
        condition: state
        entity_id: input_boolean.room_exclude_master_bedroom
        state: "off"
      - alias: "Curtains are not already open"
        condition: numeric_state
        entity_id: cover.master_bedroom_curtains
        attribute: current_position
        below: 5
      - not:
          - condition: state
            entity_id: input_select.home_mode
            state: "Vacation"
    actions:
      - action: cover.set_cover_position
        target:
          entity_id:
            - cover.master_bedroom_curtain_left
            - cover.master_bedroom_curtain_right
        data:
          position: 30

  - alias: "Close curtains around sunset"
    id: 3ba2dda8-25b0-4ceb-96d2-c79fe7612603
    triggers:
      - trigger: sun
        event: sunset
    conditions:
      - alias: "Master Bedroom automations are not disabled"
        condition: state
        entity_id: input_boolean.room_exclude_master_bedroom
        state: "off"
      - not:
          - condition: state
            entity_id: input_select.home_mode
            state: "Vacation"
    actions:
      - if:
          - condition: state
            entity_id: binary_sensor.master_bedroom_window_contact
            state: "off"
        then:
          - action: cover.set_cover_position
            target:
              entity_id:
                - cover.master_bedroom_curtain_left
                - cover.master_bedroom_curtain_right
            data:
              position: 0
        else:
          # Close left, and then wait to close right once the window is closed.
          - action: cover.set_cover_position
            target:
              entity_id:
                - cover.master_bedroom_curtain_left
            data:
              position: 0
          - wait_for_trigger:
              - trigger: state
                entity_id:
                  - binary_sensor.master_bedroom_window_contact
                to: "off"
                for:
                  seconds: 2
            continue_on_timeout: false
            timeout:
              hours: 8
          - action: cover.set_cover_position
            target:
              entity_id:
                - cover.master_bedroom_curtain_right
            data:
              position: 0
