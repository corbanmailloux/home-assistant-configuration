# UPS power outage handling lives in power_outage.yaml.
template:
  - sensor:
      - name: "UPS Load (W)"
        unit_of_measurement: W
        device_class: power
        state: >-
          {{ states("sensor.ups_load") | float * 0.01 * 560 }}

script:
  wol_proxmoxbox:
    alias: "Wake on LAN - ProxMoxBox"
    sequence:
      - action: wake_on_lan.send_magic_packet
        data:
          mac: e8:d8:d1:51:49:ab
  wol_tubby:
    alias: "Wake on LAN - Tubby NAS"
    sequence:
      - action: wake_on_lan.send_magic_packet
        data:
          mac: 00:11:32:c0:fc:77
  shutdown_proxmoxbox:
    alias: "Shutdown ProxMoxBox"
    sequence:
      - action: shell_command.proxmoxbox_shutdown

  pi_hole_disable_for_an_hour:
    alias: "Disable Adblocking for 1 Hour"
    sequence:
      action: pi_hole.disable
      data:
        duration: "01:00"
      target:
        entity_id: all

shell_command:
  proxmoxbox_shutdown: !secret proxmox_api_shutdown
