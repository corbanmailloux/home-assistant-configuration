script:
  maggie_travel_time_send:
    description: "Notify Corban that Maggie's Almost Home"
    fields:
      dismiss_notification:
        description: "true to dismiss the notification"
        example: "true"
    sequence:
      - if:
          - "{{ dismiss_notification == true }}"
        then:
          - action: notify.corban
            data:
              message: clear_notification
              data:
                tag: "maggie_home_warning"
          # Also end the Live Activity, which uses its own tag.
          - action: notify.corban
            data:
              message: clear_notification
              data:
                tag: "la_maggie_eta"
        else:
          - action: notify.corban
            data:
              title: "Maggie's Almost Home"
              message: "She's less than 10 minutes away."
              data:
                tag: "maggie_home_warning"
                push:
                  sound: "US-EN-Alexa-Wife-Is-Arriving.wav"
                  interruption-level: time-sensitive # Allows Siri to read the notification over headphones.

automation:
  - alias: Notify Corban when Maggie is almost home
    id: 5277f05f-3f90-4eb7-8ba2-973a54482623
    triggers:
      - trigger: numeric_state
        entity_id: sensor.maggie_to_home_travel_time
        below: 11
    conditions:
      - condition: state
        entity_id: person.corban
        state: "home"
      - condition: state
        entity_id: person.maggie
        state: "not_home" # Only run if Maggie isn't home or another named zone.
      - condition: state
        entity_id: timer.maggie_home_notification_cooldown
        state: idle
      - condition: time # From 7AM - 9PM
        after: "07:00:00"
        before: "21:00:00"
      - condition: state
        entity_id: input_select.home_mode
        state: "Home"
    actions:
      - alias: "Notify Corban"
        action: script.maggie_travel_time_send
        data:
          dismiss_notification: false
      - action: timer.start
        entity_id: timer.maggie_home_notification_cooldown
        data:
          duration: "00:10:00" # 10 minute cooldown before retriggering.

  # Live Activity on Corban's lock screen counting down Maggie's drive home.
  #
  # Waze refreshes the travel time roughly every minute and iOS rate-limits Live
  # Activity pushes, so this sends at most one update every two minutes (the
  # `delay` at the end of `mode: single` is the throttle). Between updates the
  # `chronometer` counts down on the phone itself, so the lock screen stays
  # roughly accurate without extra pushes.
  - id: 426bdd49-6404-4eaf-949a-4fc8019df00e
    alias: Maggie ETA - Live Activity
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.maggie_to_home_travel_time
    conditions:
      - alias: "Maggie is out, and has been for a minute"
        condition: state
        entity_id: person.maggie
        state: "not_home" # Not home and not stopped in a named zone.
        for:
          minutes: 1 # Skip the first minute after leaving home, when the ETA is still tiny.

      - alias: "Under 20 minutes and heading toward home"
        condition: template
        value_template: >-
          {% set eta = trigger.to_state.state | float(-1) %}
          {% set prev_eta = trigger.from_state.state | float(-1) %}
          {% set distance = trigger.to_state.attributes.get('distance', -1) | float(-1) %}
          {% set prev_distance = trigger.from_state.attributes.get('distance', -1) | float(-1) %}
          {#- Needs a real ETA under the threshold. -#}
          {% if eta <= 0 or eta >= 20 %}
            false
          {#- Prefer distance: it shows she is moving toward home even when traffic
              makes the ETA stall or grow. A flat distance means she is parked
              somewhere (or stopped), so don't start an activity; a rising
              distance means she is driving away (e.g. just left the house). -#}
          {% elif distance >= 0 and prev_distance >= 0 %}
            {{ distance < prev_distance }}
          {#- No distance attributes: fall back to the ETA trending down. -#}
          {% else %}
            {{ prev_eta <= 0 or eta < prev_eta }}
          {% endif %}

    actions:
      - variables:
          eta_minutes: >-
            {{ [trigger.to_state.state | float(0), 1] | max | round(0, "floor") | int }}
      - alias: "Start or update the Live Activity"
        action: notify.corban
        data:
          title: "Maggie's ETA"
          message: >-
            {{ eta_minutes }} min away · arriving
            {{ (now() + timedelta(minutes=eta_minutes)).strftime("%-I:%M %p") }}
          data:
            tag: "la_maggie_eta"
            live_update: true
            chronometer: true
            when_relative: true
            when: "{{ eta_minutes * 60 }}"
            notification_icon: mdi:car
            notification_icon_color: "#4CAF50"
            relevance_score: 0.6
            url: /map
      # Throttle: `mode: single` ignores new triggers until this finishes.
      - delay: "00:02:00"

  - id: 380345d6-b3ab-4cc1-908d-741051bb8ccf
    alias: Dismiss the notification after Maggie arrives
    triggers:
      - trigger: state
        entity_id: person.maggie
        to: "home"
        for:
          minutes: 1
      # She stopped somewhere that isn't home (a named zone) mid-trip, so the ETA
      # is no longer meaningful. Without this the Live Activity would keep
      # counting down until iOS expires it (up to 8 hours).
      - trigger: state
        entity_id: person.maggie
        from: "not_home"
        not_to:
          - "home"
          - "unknown"
          - "unavailable"
    actions:
      - alias: "Dismiss notification"
        action: script.maggie_travel_time_send
        data:
          dismiss_notification: true

timer:
  maggie_home_notification_cooldown:

homeassistant:
  customize:
    sensor.maggie_to_home_travel_time:
      icon: mdi:map-marker-distance
