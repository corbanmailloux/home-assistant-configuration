homeassistant:
  packages: !include_dir_named packages
  # allowlist_external_dirs:
  #   - /config/openhasp

default_config:

# These are all of the individual things I used to have before switching to default_config.
# updater:
# person:
# config:
# cloud:
# system_health:
# ssdp:
# zeroconf:
# sun:
# logbook:
# map:
# mobile_app:

hassio:

recorder:
  db_url: !secret mariadb_url
  exclude:
    domains:
      - updater
      - camera
      - script
    entities:
      - sensor.time
      - sensor.pi_hole_tubby_seen_clients
      # The parking sign publishes ~5x/second while a door is open. It needs to
      # stay controllable/live in HA, but its history is pure noise.
      - sensor.garage_parking_sign_range_sensor_left
      - sensor.garage_parking_sign_range_sensor_right
      - number.garage_parking_sign_display_number

history:

frontend:
  themes: !include_dir_merge_named themes
  # card-mod is loaded ONCE, as a frontend module (card-mod 4.2.1 docs:
  # "Performance improvements"). Do NOT also add it under Settings >
  # Dashboards > Resources - two different URLs = the module runs twice and
  # card-mod warns "hui-card already patched". Bump ?v= when updating it.
  extra_module_url:
    - /local/community/lovelace-card-mod/card-mod.js?v=4.2.1

lovelace:

# Allows sending a magic packet directly.
wake_on_lan:

logger:
  default: warning
  logs:
    # 3D printer integrations spit out errors because I don't leave them running.
    homeassistant.components.octoprint: critical
    custom_components.moonraker: critical
    moonraker_api: critical
  filters:
    moonraker_api.websockets.websocketclient:
      - ".*Websocket connection error: Cannot connect to host*"

ifttt:
  key: !secret ifttt_key

ffmpeg:

# spotcast:
#   sp_dc: !secret spotcast_sp_dc
#   sp_key: !secret spotcast_sp_key

tts:
  - platform: google_translate
  - platform: google_cloud
    key_file: google_cloud_credentials.json
    voice: en-US-Standard-C

automation: !include automations.yaml # For the automation editor
# binary_sensor: !include_dir_merge_list binary_sensor
group: !include_dir_merge_named group
# input_boolean: !include_dir_merge_named input_boolean
# input_select: !include_dir_merge_named input_select
light: !include_dir_merge_list light
# media_player: !include_dir_merge_list media_player
notify: !include_dir_merge_list notify
scene: !include scenes.yaml # For the scene editor
script: !include scripts.yaml
# sensor: !include_dir_merge_list sensor
# shell_command: !include_dir_merge_named shell_command
# switch: !include_dir_merge_list switch
# zone: !include_dir_merge_list zone
