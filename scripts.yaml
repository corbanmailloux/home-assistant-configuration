inovelli_led_control:
  alias: Inovelli Blue LED (Zigbee2MQTT)
  use_blueprint:
    path: zanix/inovelli_blue_led_zigbee2mqtt.yaml
  icon: mdi:led-strip
living_room_dramatic_lighting:
  sequence:
  - action: scene.create
    metadata: {}
    data:
      scene_id: living_room_pre_drama
      snapshot_entities:
      - update.living_room_lights_wall_switch_1
      - update.living_room_lights_wall_switch_2
      - update.living_room_lights_wall_switch_3
      - light.corner_lamp
      - update.reading_lamp
      - update.living_room_cabinet_lights
  - action: light.turn_off
    metadata: {}
    data:
      transition: 0
    target:
      area_id: 6a82246dbc29484cb9558c88e6e7be5d
  - repeat:
      count: 3
      sequence:
      - action: light.turn_off
        metadata: {}
        data:
          transition: 0
        target:
          entity_id: light.living_room_lights_wall_switch_1
      - action: light.turn_on
        metadata: {}
        data:
          transition: 0
          brightness_pct: 50
        target:
          entity_id: light.living_room_lights_wall_switch_3
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 600
      - action: light.turn_off
        metadata: {}
        data:
          transition: 0
        target:
          entity_id: light.living_room_lights_wall_switch_3
      - action: light.turn_on
        metadata: {}
        data:
          transition: 0
          brightness_pct: 50
        target:
          entity_id: light.living_room_lights_wall_switch_2
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 600
      - action: light.turn_off
        metadata: {}
        data:
          transition: 0
        target:
          entity_id: light.living_room_lights_wall_switch_2
      - action: light.turn_on
        metadata: {}
        data:
          transition: 0
          brightness_pct: 50
        target:
          entity_id: light.living_room_lights_wall_switch_1
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 600
  - action: scene.turn_on
    metadata: {}
    data:
      transition: 2
    target:
      entity_id: scene.living_room_pre_drama
  alias: Living Room Dramatic Lighting
  description: ''
start_sprinker_for_limited_time:
  sequence:
  - action: timer.start
    metadata: {}
    data: {}
    target:
      entity_id: timer.irrigation_off_timer
  - action: switch.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: switch.sprinkler_valve_1
  alias: Start sprinker for limited time
  description: ''
run_sprinkler_with_fields:
  alias: Run Sprinkler - Fields
  description: Run a sprinkler for a specified duration. Use variables.
  mode: parallel
  max: 10
  icon: mdi:sprinkler-variant
  fields:
    input_entity_id:
      selector:
        entity:
          filter:
            domain: valve
      name: Entity
      description: entity_id of the sprinkler switch to run. Friendly Name is extracted
        and used for MQTT topic.
      required: true
    runtime_in_seconds:
      selector:
        number:
          min: 1
          max: 1800
      default: 60
      name: Runtime (seconds)
      description: Duration to run the sprinkler in seconds.
      required: true
  sequence:
  - action: mqtt.publish
    data:
      qos: 0
      retain: false
      payload: "{\n  \"state\" : \"ON\",\n  \"on_time\": {{ runtime_in_seconds }}\n}"
      topic: '{{ ''zigbee2mqtt/'' ~ device_name(input_entity_id) ~ ''/set'' }}'
      evaluate_payload: true
  - delay:
      seconds: '{{ runtime_in_seconds + 30 }}'
    alias: Delay for runtime + 30 seconds
  - if:
    - condition: template
      value_template: '{{ is_state(input_entity_id, ''on'') }}'
      alias: If the valve is still on...
    then:
    - data:
        title: Sprinkler Still On
        message: '{{ device_name(input_entity_id) }} is still on after {{ (runtime_in_seconds
          + 65) // 60 }} minutes. Forcibly turning it off.'
      action: notify.corban
    - action: mqtt.publish
      data:
        qos: 0
        retain: false
        payload: '{"state": "OFF"}'
        topic: '{{ ''zigbee2mqtt/'' ~ device_name(input_entity_id) ~ ''/set'' }}'
